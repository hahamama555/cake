<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>みんなで巨大ケーキを作ろう！</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#503b35;background:#f6e9ee}
body{min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
#app{container-type:size;aspect-ratio:3/5;height:min(calc(100dvh - 12px),calc((100vw - 12px)*5/3));display:flex;flex-direction:column;gap:1.2cqw;padding:2.2cqw;background:linear-gradient(135deg,#fff1f5,#fff8e9);border-radius:14px;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;gap:2cqw;flex:none}
h1{font-size:4.3cqw;margin:0;color:#a84d70;line-height:1.15}
.subtitle{font-size:2.5cqw;font-weight:700}
.totalbox{background:#fff;border:.5cqw solid #ffd0df;border-radius:3cqw;padding:1cqw 2.5cqw;text-align:center}
.total{font-size:6cqw;font-weight:900;color:#d94f83;line-height:1.05}
.totalbox small{font-size:2.2cqw}
.progress{height:2cqw;background:#f4dce4;border-radius:2cqw;overflow:hidden;flex:none}
#bar{height:100%;width:0;background:linear-gradient(90deg,#ff9bb9,#f6bd63);transition:width .35s}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.2cqw}
.materials{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1cqw}
.material{background:rgba(255,255,255,.88);border:.5cqw solid #f5d5df;border-radius:3cqw;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;padding:1.2cqw .6cqw;gap:.8cqw;overflow:hidden}
.material h2{font-size:2.7cqw;margin:0;white-space:nowrap}
.pile{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(to top,#fff0f5 0%,#fffafc 75%);border-radius:2.5cqw}
.stack{width:100%;height:100%;display:flex;flex-wrap:wrap;align-content:flex-end;align-items:flex-end;justify-content:center;gap:.1cqw;padding:1.5cqw .3cqw}
.stack-item{width:2.9cqw;height:2.9cqw;font-size:2.5cqw;line-height:1;display:inline-flex;align-items:center;justify-content:center;filter:drop-shadow(0 1px 1px #61423a22)}
.stack-item.pop-once{animation:stackIn .32s ease both}
@keyframes stackIn{from{transform:translateY(3cqw) scale(.55);opacity:.25}to{transform:none;opacity:1}}
.pilecount{position:absolute;bottom:.6cqw;right:.6cqw;z-index:2;background:#fff0f5;border:1px solid #f5c6d5;border-radius:2cqw;padding:.2cqw 1.2cqw;font-weight:800;font-size:2.6cqw}
.material.bump .pile{animation:pileFlash .38s ease}
@keyframes pileFlash{50%{background:#ffe0eb;transform:scale(1.025)}}
.count{font-size:4.2cqw;font-weight:900;color:#b54f72;line-height:1}
button{font:inherit;cursor:pointer}
button:active{transform:scale(.96)}
.material button{font-size:2.5cqw;padding:0 .8cqw;height:6.5cqw;border:0;border-radius:2cqw;background:#ffe0e9;color:#8e3e5c;font-weight:800;white-space:nowrap}
.side{display:flex;flex-direction:column;gap:1.2cqw;flex:none}
.panel{background:#fff;border:.3cqw solid #f1d8df;border-radius:2.5cqw;padding:1.5cqw}
.panel h3{font-size:3cqw;margin:0 0 1cqw;color:#a84d70}
.gifts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1cqw}
.gifts button{font-size:2.4cqw;line-height:1.2;padding:.8cqw .3cqw;height:9cqw;border:.3cqw solid #f0cbd7;border-radius:2cqw;background:#fff7fa;color:#67434e;font-weight:700}
.gifts span{display:block;font-size:.9em;color:#c04e78}
.note{display:none}
.statusrow{display:flex;align-items:center;gap:1.5cqw}
.status{flex:1;text-align:center;font-weight:800;font-size:3.2cqw;color:#a84d70}
.reset{height:7cqw;padding:0 3cqw;font-size:2.6cqw;border:.3cqw solid #f0cbd7;border-radius:2cqw;background:#f8f1ed;color:#67434e;font-weight:700}
footer{flex:none;text-align:center;font-size:2.1cqw;font-weight:700;color:#92777a}
#done{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,248,237,.94);border-radius:3cqw;overflow:hidden;text-align:center}
#done.show{display:flex}
#done .cake{font-size:42cqw;line-height:1;animation:cakePop .9s cubic-bezier(.2,1.4,.4,1) both,cakeBob 2s ease-in-out .9s infinite}
@keyframes cakePop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
@keyframes cakeBob{50%{transform:translateY(-2cqw) scale(1.04)}}
#done .doneText{font-size:6.4cqw;font-weight:900;color:#d94f83;margin-top:2cqw}
#done .doneSub{font-size:3.6cqw;font-weight:800;color:#a84d70;margin-top:1cqw}
.confetti{position:absolute;top:-8cqw;font-size:5cqw;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(120cqh) rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
<header>
 <div><h1>🎂 みんなで巨大ケーキを作ろう！</h1><div class="subtitle">材料名をコメントしてね！</div></div>
 <div class="totalbox"><div class="total" id="total">0 / 300</div><small>材料あつめ</small></div>
</header>
<div class="progress"><div id="bar"></div></div>
<main>
 <section class="materials" id="materials">
  <article class="material" data-key="egg"><h2>🥚 たまご</h2><div class="pile"><div class="stack" aria-label="たまごのたまり具合"></div><div class="pilecount">×<span>0</span></div></div><div class="count">0個</div><button onclick="addMaterial('egg')">＋ たまご</button></article>
  <article class="material" data-key="flour"><h2>🌾 小麦粉</h2><div class="pile"><div class="stack" aria-label="小麦粉のたまり具合"></div><div class="pilecount">×<span>0</span></div></div><div class="count">0個</div><button onclick="addMaterial('flour')">＋ 小麦粉</button></article>
  <article class="material" data-key="milk"><h2>🥛 牛乳</h2><div class="pile"><div class="stack" aria-label="牛乳のたまり具合"></div><div class="pilecount">×<span>0</span></div></div><div class="count">0個</div><button onclick="addMaterial('milk')">＋ 牛乳</button></article>
  <article class="material" data-key="sugar"><h2>🍬 砂糖</h2><div class="pile"><div class="stack" aria-label="砂糖のたまり具合"></div><div class="pilecount">×<span>0</span></div></div><div class="count">0個</div><button onclick="addMaterial('sugar')">＋ 砂糖</button></article>
  <article class="material" data-key="butter"><h2>🧈 バター</h2><div class="pile"><div class="stack" aria-label="バターのたまり具合"></div><div class="pilecount">×<span>0</span></div></div><div class="count">0個</div><button onclick="addMaterial('butter')">＋ バター</button></article>
 <div id="done"><div class="cake">🎂</div><div class="doneText">巨大ケーキ完成！</div><div class="doneSub">みんなありがとう！ケーキ作りスタート！</div></div>
 </section>
 <aside class="side">
  <section class="panel"><h3>🎁 ギフトお礼ボタン</h3><div class="gifts">
   <button onclick="gift(1)">💗 ハートミー<span>材料 ＋1</span></button>
   <button onclick="gift(3)">🍩 ドーナツ<span>材料 ＋3</span></button>
   <button onclick="gift(10)">🫶 ハートポーズ<span>材料 ＋10</span></button>
   <button onclick="gift(-10)">🍄 歌うきのこ<span>材料 −10</span></button>
   <button onclick="gift(30)">🐶 コーギー<span>材料 ＋30</span></button>
   <button onclick="gift(-30)">🤝 団結<span>材料 −30</span></button>
   <button onclick="gift(50)">💸 マネーガン<span>材料 ＋50</span></button>
   <button onclick="gift(-50)">✨ すばらしい<span>材料 −50</span></button>
  </div><div class="note">ギフトの増減は5種類の材料に自動で振り分けます。</div></section>
  <section class="panel statusrow"><div class="status" id="status">あと300個！みんなで集めよう！</div><button class="reset" onclick="resetAll()">↻ リセット</button></section>
 </aside>
</main>
<footer>材料ボタン：コメントを見て手動でタップ ／ 目標は5種類合計300個</footer>
</div>
<script>
const keys=['egg','flour','milk','sugar','butter'];
const counts={egg:0,flour:0,milk:0,sugar:0,butter:0};
const names={egg:'たまご',flour:'小麦粉',milk:'牛乳',sugar:'砂糖',butter:'バター'};
const emojis={egg:'🥚',flour:'🌾',milk:'🥛',sugar:'🍬',butter:'🧈'};
const goal=300;
function total(){return keys.reduce((s,k)=>s+counts[k],0)}
function render(bumpKey=null){
 keys.forEach(k=>{
  const el=document.querySelector(`[data-key="${k}"]`);
  el.querySelector('.count').textContent=counts[k]+'個';
  el.querySelector('.pilecount span').textContent=counts[k];
  // 1回の材料ボタン操作につき、材料アイコンを1つ追加。
  // 表示は最大100個にして、増えた瞬間の1個だけをアニメーション。
  const stack=el.querySelector('.stack');
  const icons=Math.min(100,counts[k]);
  const first=Math.max(0,counts[k]-100);
  stack.innerHTML=Array.from({length:icons},(_,i)=>{
    const isNew = bumpKey===k && i===icons-1;
    return `<span class="stack-item${isNew?' pop-once':''}">${emojis[k]}</span>`;
  }).join('');
  stack.style.setProperty('--fill',Math.min(100,counts[k]/60*100)+'%');
  el.classList.remove('bump');
  if(bumpKey===k){void el.offsetWidth;el.classList.add('bump')}
 });
 const t=total(),pct=Math.min(100,t/goal*100);
 document.getElementById('total').textContent=`${t} / ${goal}`;
 document.getElementById('bar').style.width=pct+'%';
 document.getElementById('done').classList.toggle('show',t>=goal);
 document.getElementById('status').textContent=t>=goal?'🎉 材料300個達成！ケーキ作りスタート！':`あと${goal-t}個！みんなで集めよう！`;
}
function addMaterial(k){counts[k]++;render(k)}
function distribute(amount){
 if(amount>0){
  for(let i=0;i<amount;i++){let min=Math.min(...keys.map(k=>counts[k]));let candidates=keys.filter(k=>counts[k]===min);counts[candidates[Math.floor(Math.random()*candidates.length)]]++}
 }else{
  for(let i=0;i<Math.abs(amount);i++){let max=Math.max(...keys.map(k=>counts[k]));if(max<=0)break;let candidates=keys.filter(k=>counts[k]===max);counts[candidates[Math.floor(Math.random()*candidates.length)]]--}
 }
}
function gift(n){distribute(n);render()}
function resetAll(){keys.forEach(k=>counts[k]=0);render()}
(function(){const d=document.getElementById('done'),em=['🍓','✨','🎉','🍰','🎂','💗'];
 for(let i=0;i<14;i++){const c=document.createElement('span');c.className='confetti';c.textContent=em[i%em.length];
  c.style.left=(Math.random()*92)+'%';c.style.animationDuration=(3+Math.random()*3).toFixed(1)+'s';c.style.animationDelay=(-Math.random()*5).toFixed(1)+'s';d.appendChild(c)}})();
render();
</script>
</body>
</html>
